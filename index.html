<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qari</title>
<meta name="description" content="Qari — an offline Quran recitation companion." />
<style>
  :root {
    --bg: #0d1110;
    --ink: #f2ede2;
    --ink-muted: #96a49f;
    --accent: #45d8d0;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #faf7f1; --ink: #1b211f; --ink-muted: #5c6864; --accent: #0c7a73; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 2.5rem;
    margin: 0;
    color: var(--accent);
  }
  p { margin: 0; color: var(--ink-muted); max-width: 28rem; line-height: 1.6; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>Qari</h1>
  <p>An offline Quran recitation companion — listens as you recite, entirely on your device.</p>
  <p><a href="/privacy-policy.html">Privacy Policy</a></p>
</body>
</html>
